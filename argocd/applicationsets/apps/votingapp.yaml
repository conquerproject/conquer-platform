apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: "votingapp"
  namespace: "argocd"
spec:
  generators:
    - git:
        repoURL: "https://github.com/conquerproject/conquer-platform.git"
        revision: "main"
        files:
          - path: "argocd/clusters/aks-conquerproject-dev-01.yaml"
  template:
    metadata:
      name: "votingapp-{{ clusterName }}"
    spec:
      project: "apps"
      source:
        repoURL: "https://github.com/conquerproject/votingapp.git"
        targetRevision: "{{ revision }}"
        path: "argocd/{{ environment}}"
        directory:
          recurse: true

      destination:
        server: "{{ server }}"
        namespace: "votingapp-{{ environment }}"

      syncPolicy:
        automated: {}
        syncOptions:
          - "CreateNamespace=true"
